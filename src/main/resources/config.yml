# 商店界面操作设置。
shop:
  # 玩家点击商品后，再次执行商品操作前需要等待的毫秒数。
  click_cooldown: 200

# 商店刷新周期使用的时区。
timezone: 'Asia/Shanghai'

database:
  # 可用类型：SQLite、MySQL。
  type: 'SQLite'

  # 数据清理任务每天执行的时间。
  cleanup:
    enabled: true
    run-at: '04:00:00'
    # 已过期随机商店数据的保留天数，-1 表示永久保留。
    expired-cycles-days: 7
    # 玩家交易流水的保留天数，-1 表示永久保留。
    transaction-history-days: -1

  SQLite:
    file: 'database.db'

  MySQL:
    host: 'localhost'
    port: 3306
    database: 'mycraftdailyshop'
    username: 'mycraftdailyshop'
    password: ''
    use-ssl: false
    connection-timeout: 5000
    maximum-pool-size: 10
    minimum-idle: 2
