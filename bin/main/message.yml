enchantments:
  preLore:
    - '可能的附魔：'
    # [enchantmentList] 会根据配置，展示多行附魔数据
    - '[enchantmentDisplay]'
    - ''
  # 单组附魔展示样式
  # [enchantmentGroupDisplay] 附魔组样式，由附魔名和分隔符组成
  enchantment:
    - '- [enchantmentGroupDisplay] [minLevel]-[maxLevel] | 概率 [enchantmentChance] | 溢价 [minPremium]-[maxPremium]'
  # enchantmentGroupDisplay 的分隔符
  enchantmentSplit: '/'
  # 附魔汉化；未配置的附魔会显示 Bukkit 枚举名。
  enchantmentName:
    PROTECTION_ENVIRONMENTAL: '保护'
    PROTECTION_FIRE: '火焰保护'
    PROTECTION_FALL: '摔落保护'
