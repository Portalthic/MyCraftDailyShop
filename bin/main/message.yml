    PROTECTION_PROJECTILE: '弹射物保护'
    OXYGEN: '水下呼吸'
    WATER_WORKER: '水下速掘'
    THORNS: '荆棘'
    DEPTH_STRIDER: '深海探索者'
    FROST_WALKER: '冰霜行者'
    BINDING_CURSE: '绑定诅咒'
    DAMAGE_ALL: '锋利'
    DAMAGE_UNDEAD: '亡灵杀手'
    DAMAGE_ARTHROPODS: '节肢杀手'
    KNOCKBACK: '击退'
    FIRE_ASPECT: '火焰附加'
    LOOT_BONUS_MOBS: '抢夺'
    SWEEPING_EDGE: '横扫之刃'
    DIG_SPEED: '效率'
    SILK_TOUCH: '精准采集'
    DURABILITY: '耐久'
    LOOT_BONUS_BLOCKS: '时运'
    ARROW_DAMAGE: '力量'
    ARROW_KNOCKBACK: '冲击'
    ARROW_FIRE: '火矢'
