prefix: '&8[&6每日商店&8] '

command:
  no-permission: '[prefix]&c你没有执行该命令的权限。'
  player-not-found: '[prefix]&c找不到玩家 [player]，该玩家需要至少进入过一次服务器。'
  shop-not-found: '[prefix]&c不存在商店 [shop]。'
  player-only: '[prefix]&c该操作需要指定在线玩家。'
  invalid-usage: '[prefix]&c命令参数不正确，请使用 /mcds 查看帮助。'
  success: '[prefix]&a操作已完成。'
  failed: '[prefix]&c操作失败：[reason]'
  reload-success: '[prefix]&a配置已重新加载，共加载 [shops] 个商店。'
  validate-success: '[prefix]&a配置检查完成，共有 [shops] 个有效商店。'
  help:
    - '&6/mcds open <玩家> <商店> &7- 打开当前随机商店'
    - '&6/mcds show <玩家> <商店> &7- 展示全部候选商品'
    - '&6/mcds quota reset player <玩家|*> <商店|*> &7- 重置个人限购'
    - '&6/mcds quota reset server <商店|*> &7- 重置全服库存'
    - '&6/mcds refresh <商店|*> [--player <玩家>] &7- 刷新商店'
    - '&6/mcds reload &7- 重新加载配置'
    - '&6/mcds validate &7- 检查商店配置'

shop:
  sort:
    index: '索引'
    chance: '概率'
    money: '价格'
    amount: '数量'
  order:
    ascending: '升序'
    descending: '降序'
  loading: '[prefix]&7正在读取商店，请稍候。'
  stale: '[prefix]&c商店已经刷新，请重新打开。'
  cooldown: '[prefix]&c操作太快了，请稍后再试。'
  no-money: '[prefix]&c余额不足，本次交易需要 [totalMoney]。'
  no-item: '[prefix]&c你没有足够的 [item]，本次需要 [amount] 个。'
  personal-limit: '[prefix]&c你在本周期内已经不能继续交易该商品。'
  server-limit: '[prefix]&c该商品的全服库存已经耗尽。'
  buy-success: '[prefix]&a花费 [totalMoney] 购买了 [amount] 个 [item]。'
  sell-success: '[prefix]&a出售 [amount] 个 [item]，获得 [totalMoney]。'
  overflow: '[prefix]&e背包空间不足，放不下的商品已经掉落在脚下。'
  transaction-failed: '[prefix]&c交易没有完成，请稍后重试。'
  empty: '[prefix]&c当前周期没有随机到任何商品。'

